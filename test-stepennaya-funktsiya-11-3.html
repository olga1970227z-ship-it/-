<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Узнай график степенной функции — тест</title>
<style>
:root{color-scheme:light;--ink:#172d48;--muted:#4b6078;--blue:#183e69;--line:#d6e2ec;--accent:#08766a;--paper:#edf4fa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.48 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 18px 42px}
[hidden]{display:none!important}h1,h2,p{margin:0}h1{font-size:clamp(26px,5vw,42px);line-height:1.13;max-width:19em}h2{font-size:clamp(21px,3.4vw,29px);line-height:1.28}header{border-radius:19px;padding:25px 27px 28px;background:#142e51;color:white}header p{margin-bottom:9px;color:#c7dcf5;font-size:13px;font-weight:750;letter-spacing:.1em}
.panel{margin-top:15px;padding:22px;border:1px solid var(--line);border-radius:17px;background:white}.start-copy{margin:9px 0 18px;color:var(--muted)}label[for=name]{font-weight:700;display:block;margin-bottom:5px}input[name=student]{display:block;width:min(100%,400px);height:46px;margin-bottom:15px;padding:8px 12px;border-radius:9px;border:1px solid #a9bacd;font:inherit}
button{min-height:44px;border-radius:9px;border:1px solid var(--line);background:white;color:var(--ink);padding:8px 14px;font:650 15px system-ui,sans-serif;cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.finish{color:#183e69}button:disabled{opacity:.47;cursor:default}:focus-visible{outline:3px solid #227ecd;outline-offset:3px}
.stats{display:flex;justify-content:space-between;gap:10px;font-weight:700}.stats span:last-child{font-variant-numeric:tabular-nums}.stats .urgent{color:#ad3726}progress{width:100%;height:11px;accent-color:var(--accent);display:block;margin:12px 0 15px}
nav{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}nav button{padding:0;min-height:39px}nav button.done{background:#e1f4ec;color:#145f4c}nav button[aria-current=true]{border:2px solid #116b9b}.question-label{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:7px}
.graph{display:block;width:min(100%,330px);aspect-ratio:1;margin:13px auto 16px;border-radius:8px;border:1px solid var(--line);object-fit:contain}.options{border:0;margin:17px 0 0;padding:0;display:grid;gap:8px}
.option{border:1px solid #d3e0ed;border-radius:10px;display:flex;align-items:center;gap:11px;min-height:49px;padding:8px 12px;cursor:pointer}.option:has(input:checked){border-color:var(--accent);background:#e8f6f1}.option input{margin:0;accent-color:var(--accent);width:18px;height:18px;flex:none}.formula{font-family:Georgia,serif;font-size:1.21em;white-space:nowrap}.formula sup{font-size:.72em}.buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:18px}
#score{font-size:clamp(27px,5vw,40px);color:var(--accent);font-weight:800;margin:5px 0}#review>article{border-top:1px solid var(--line);padding-top:13px;margin-top:13px}#review h3{font-size:16px;margin:0 0 5px}#review p,#reason{color:var(--muted)}#review .wrong{color:#9b3829}#review .correct{color:#126654}#review .graph{width:min(100%,200px);margin-left:0}#retry{margin-top:15px}
dialog{width:min(calc(100% - 36px),430px);padding:22px;border:1px solid var(--line);border-radius:16px;color:var(--ink)}dialog::backdrop{background:#132d5399}dialog p{margin-top:9px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:520px){main{padding:12px 10px 30px}.panel,header{padding:16px}nav{grid-template-columns:repeat(5,minmax(0,1fr))}.buttons button{flex:1 1 auto}#finish{flex-basis:100%}}
</style>
</head>
<body>
<main>
<header><p>АЛГЕБРА · 11 КЛАСС</p><h1>Узнай график степенной функции</h1></header>
<section class="panel" id="intro">
<h2>Интерактивный тест</h2>
<p class="start-copy">10 заданий · 10 минут · 1 балл за каждый верный ответ. Для каждого графика выберите формулу. Показатели могут быть целыми или дробными.</p>
<form id="startForm"><label for="name">Фамилия и имя</label><input id="name" name="student" maxlength="90" autocomplete="name" required><button class="primary" type="submit">Начать тест</button></form>
</section>
<section id="quiz" hidden>
<div class="panel">
<div class="stats"><span id="answered" aria-live="polite"></span><span id="timer" role="timer"></span></div>
<progress id="progress" value="0" max="10" aria-label="Количество выполненных заданий"></progress>
<nav id="navigation" aria-label="Номера заданий"></nav>
</div>
<section class="panel" aria-labelledby="question">
<p class="question-label" id="number"></p><h2 id="question" tabindex="-1"></h2>
<img class="graph" id="graph" alt="" hidden>
<fieldset class="options" id="options"><legend class="sr">Выберите один ответ</legend></fieldset>
<div class="buttons"><button type="button" id="prev">Назад</button><button type="button" id="next" class="primary">Далее</button><button type="button" id="finish" class="finish">Завершить тест</button></div>
</section>
</section>
<section class="panel" id="results" hidden>
<h2 id="resultTitle" tabindex="-1">Результат</h2>
<p id="studentName"></p><p id="score"></p><p id="reason"></p>
<div id="review"></div><button type="button" id="retry">Пройти заново</button>
</section>
<dialog id="confirmation" aria-labelledby="confirmTitle">
<h2 id="confirmTitle">Завершить тест?</h2><p id="missing"></p>
<div class="buttons"><button type="button" id="cancel" autofocus>Продолжить тест</button><button type="button" id="submit" class="primary">Завершить</button></div>
</dialog>
</main>

const items = [{"graph": 0, "options": ["2/3", "1/2", "−1/2", "1/3"], "key": 1, "alt": "Одна возрастающая ветвь начинается в начале координат и идёт вправо вверх.", "why": "График квадратного корня начинается в начале координат и расположен справа от оси Oy."}, {"graph": 1, "options": ["1/2", "1/3", "−2/3", "2/3"], "key": 3, "alt": "Две ветви над осью Ox сходятся в начале координат.", "why": "Чётный числитель и нечётный знаменатель дают симметрию относительно Oy, а положительный показатель позволяет включить точку (0; 0)."}, {"graph": 2, "options": ["1/3", "3", "2/3", "−1/3"], "key": 0, "alt": "Возрастающий график проходит через начало координат. Около нуля кривая крутая, дальше становится положе.", "why": "Кубический корень y = x<sup>1/3</sup> меняет знак вместе с x. Около начала координат график крутой, дальше выравнивается."}, {"graph": 3, "options": ["−1/3", "1/2", "−1/2", "−2/3"], "key": 2, "alt": "Одна убывающая ветвь в первой четверти приближается к обеим координатным осям.", "why": "У функции y = x<sup>−1/2</sup> область определения x > 0. Поэтому есть только одна убывающая ветвь."}, {"graph": 4, "options": ["2/3", "−2/3", "−1/2", "−1/3"], "key": 1, "alt": "Две ветви над осью Ox приближаются к координатным осям и симметричны относительно Oy.", "why": "При показателе −2/3 обе ветви положительны. Из-за отрицательного показателя график приближается к осям."}, {"graph": 5, "options": ["−1/3", "1/3", "−1/2", "−2/3"], "key": 0, "alt": "Две отдельные ветви лежат в первой и третьей четвертях и приближаются к осям.", "why": "Нечётные числитель и знаменатель дают симметрию относительно начала координат. Отрицательный показатель исключает точку x = 0."}, {"graph": 6, "options": ["2/3", "−2", "3", "2"], "key": 3, "alt": "Симметричный график с вершиной в начале координат. Около начала он пологий, затем становится круче.", "why": "Это парабола y = x². Она симметрична относительно Oy и проходит через точки (−2; 4) и (2; 4)."}, {"graph": 7, "options": ["2", "1/3", "3", "−1"], "key": 2, "alt": "Возрастающая кривая проходит через начало координат. Около нуля она пологая, дальше становится круче.", "why": "График y = x³ пологий у начала координат и резко поднимается справа. У кубического корня кривая у нуля, наоборот, крутая."}, {"graph": 8, "options": ["−1/3", "−1", "−2", "3"], "key": 1, "alt": "Две ветви в первой и третьей четвертях. На правой ветви отмечена точка (2; 1/2).", "why": "Подставляем x = 2: получаем 2<sup>−1</sup> = 1/2. Обе ветви гиперболы симметричны относительно начала координат."}, {"graph": 9, "options": ["−2", "2", "−2/3", "−1"], "key": 0, "alt": "Две ветви расположены выше оси Ox. На правой ветви отмечена точка (2; 1/4).", "why": "У y = x<sup>−2</sup> значения на обеих ветвях положительны, а при x = 2 получаем 2<sup>−2</sup> = 1/4."}].map(item => ({...item, text:'Какая формула задаёт этот график?', options:item.options.map(formula)}));

const el = id => document.getElementById(id);
const total = items.length;
const duration = 10 * 60 * 1000;
const dialog = el('confirmation');
let answers = [], current = 0, deadline = 0, ticker = 0, running = false, student = '';
const answeredCount = () => answers.filter(answer => answer !== null).length;

function buttonForQuestion(item, index) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = index + 1;
  button.addEventListener('click', () => show(index, true));
  return button;
}
const navigation = items.map(buttonForQuestion);
el('navigation').append(...navigation);

function updateProgress() {
  const count = answeredCount();
  el('answered').textContent = 'Выполнено ' + count + ' из ' + total;
  el('progress').value = count;
  navigation.forEach((button, index) => {
    const done = answers[index] !== null;
    button.classList.toggle('done', done);
    button.setAttribute('aria-current', index === current ? 'true' : 'false');
    button.setAttribute('aria-label', 'Задание ' + (index + 1) + (done ? ', есть ответ' : ', без ответа'));
  });
}
function show(index, focus = false) {
  if (!running || index < 0 || index >= total) return;
  if (Date.now() >= deadline) { finish(true); return; }
  current = index;
  const item = items[index];
  el('number').textContent = 'Задание ' + (index + 1) + ' из ' + total;
  el('question').innerHTML = item.text;
  const graph = el('graph');
  graph.hidden = item.graph === undefined;
  if (!graph.hidden) { graph.src = plots[item.graph]; graph.alt = item.alt; }
  else { graph.removeAttribute('src'); graph.alt = ''; }

  const fieldset = el('options');
  fieldset.querySelectorAll('label').forEach(label => label.remove());
  item.options.forEach((option, optionIndex) => {
    const label = document.createElement('label');
    label.className = 'option';
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'answer';
    radio.checked = answers[index] === optionIndex;
    radio.addEventListener('change', () => {
      if (Date.now() >= deadline) { finish(true); return; }
      answers[index] = optionIndex;
      updateProgress();
    });
    const content = document.createElement('span');
    content.innerHTML = option;
    label.append(radio, content);
    fieldset.append(label);
  });
  el('prev').disabled = index === 0;
  el('next').hidden = index === total - 1;
  updateProgress();
  if (focus) el('question').focus();
}
function tick() {
  if (!running) return;
  const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  el('timer').textContent = String(Math.floor(remaining / 60)).padStart(2,'0') + ':' + String(remaining % 60).padStart(2,'0');
  el('timer').classList.toggle('urgent',remaining < 60);
  if (remaining === 0) finish(true);
}
function finish(expired) {
  if (!running) return;
  running = false;
  clearInterval(ticker);
  if (dialog.open) dialog.close();
  const score = items.filter((item, index) => item.key === answers[index]).length;
  const percent = Math.round(score * 100 / total);
  const grade = percent >= 86 ? 5 : percent >= 65 ? 4 : percent >= 40 ? 3 : 2;
  el('quiz').hidden = true;
  el('results').hidden = false;
  el('studentName').textContent = student;
  el('score').textContent = score + ' из ' + total + ' · ' + percent + '% · оценка «' + grade + '»';
  el('reason').textContent = (expired ? 'Время вышло. ' : '') + (score === total ? 'Все ответы верны.' : 'Разбор заданий с ошибками и пропусками.');
  el('review').replaceChildren();
  items.forEach((item, index) => {
    const answer = answers[index];
    if (answer === item.key) return;
    const article = document.createElement('article');
    article.innerHTML = '<h3>' + (index + 1) + '. ' + item.text + '</h3>';
    if (item.graph !== undefined) {
      const img = new Image(); img.className = 'graph'; img.src = plots[item.graph]; img.alt = item.alt;
      article.append(img);
    }
    const details = document.createElement('div');
    details.innerHTML = '<p class="wrong">Ваш ответ: ' + (answer === null ? 'пропущено' : item.options[answer]) + '</p><p class="correct">Верный ответ: ' + item.options[item.key] + '</p><p>' + item.why + '</p>';
    article.append(details);
    el('review').append(article);
  });
  el('resultTitle').focus();
}
el('name').addEventListener('input', () => el('name').setCustomValidity(''));
el('startForm').addEventListener('submit', event => {
  event.preventDefault();
  student = el('name').value.trim();
  if (!student) { el('name').setCustomValidity('Введите фамилию и имя.'); el('name').reportValidity(); return; }
  answers = Array(total).fill(null);
  running = true;
  deadline = Date.now() + duration;
  el('intro').hidden = true;
  el('quiz').hidden = false;
  show(0, true);
  ticker = setInterval(tick, 250);
  tick();
});
el('prev').addEventListener('click', () => show(current - 1, true));
el('next').addEventListener('click', () => show(current + 1, true));
el('finish').addEventListener('click', () => {
  const count = total - answeredCount();
  el('missing').textContent = count ? 'Заданий без ответа: ' + count + '. Можно вернуться к ним.' : 'Ответы выбраны во всех заданиях.';
  dialog.showModal();
});
el('cancel').addEventListener('click', () => dialog.close());
el('submit').addEventListener('click', () => finish(Date.now() >= deadline));
el('retry').addEventListener('click', () => {
  el('results').hidden = true;
  el('intro').hidden = false;
  el('name').focus();
});
document.addEventListener('visibilitychange', tick);
</script>
</body>
</html>
